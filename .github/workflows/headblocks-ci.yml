name: Headblocks CI

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build jars
        run: ./gradlew paperJar spigotJar --no-daemon
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: HeadBlocks-jars
          path: build/*.jar
